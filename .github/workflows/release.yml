name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check version matches tag
        run: |
          V=$(node -p "require('./module.json').version")
          test "v$V" = "$GITHUB_REF_NAME" || { echo "module.json $V != tag $GITHUB_REF_NAME"; exit 1; }
          node -e "const m=require('./module.json'); if(!m.download.includes('/releases/download/'+process.env.GITHUB_REF_NAME+'/')) { console.error('download URL does not match tag'); process.exit(1); }"

      - name: Build compendium packs
        run: |
          npm install --no-save @foundryvtt/foundryvtt-cli@^3
          node tools/build-packs.mjs

      - name: Zip module
        run: zip -r -q module.zip module.json LICENSE.txt README.md CHANGELOG.md scripts styles lang data icons packs

      - name: Release notes
        run: |
          awk -v t="## ${GITHUB_REF_NAME#v}" '$0 ~ "^## " { p = index($0, t) == 1 } p' CHANGELOG.md > notes.md
          test -s notes.md || echo "Release $GITHUB_REF_NAME" > notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" module.zip module.json --title "$GITHUB_REF_NAME" --notes-file notes.md
