name: Release

on:
  push:
    branches: [main]
    paths: [module.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Version
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./module.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; echo "$TAG already released"; fi
          node -e "const m=require('./module.json'); if(!m.download.includes('/releases/download/$TAG/')) { console.error('download URL does not match $TAG'); process.exit(1); }"

      - name: Validate before publishing
        run: |
          node --input-type=module --check < scripts/jjk5e.js
          node --test tests/*.test.mjs
          node tools/audit-techniques.mjs --check

      - name: Build compendium packs
        if: steps.v.outputs.exists != 'true'
        run: |
          npm install --no-save @foundryvtt/foundryvtt-cli
          node tools/build-packs.mjs

      - name: Zip module
        if: steps.v.outputs.exists != 'true'
        run: |
          zip -r -q release-module.zip module.json LICENSE.txt README.md CHANGELOG.md scripts styles lang data icons fonts packs
          mv release-module.zip module.zip

      - name: Release notes
        if: steps.v.outputs.exists != 'true'
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          awk -v t="## ${TAG#v}" '$0 ~ "^## " { p = index($0, t) == 1 } p' CHANGELOG.md > notes.md
          test -s notes.md || echo "Release $TAG" > notes.md

      - name: Publish release
        if: steps.v.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.v.outputs.tag }}" module.zip module.json --target "$GITHUB_SHA" --title "${{ steps.v.outputs.tag }}" --notes-file notes.md
